[project]
name = "gemini-media-mcp"
version = "1.0.0"
description = "MCP server for multimedia analysis using Google Gemini AI"
authors = [
    {name = "Vladimir", email = "your-email@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "google-genai>=1.52.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "imageio>=2.0.0",
    "imageio-ffmpeg>=0.5.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0"
]
cli = [
    "click>=8.0.0",
    "typer>=0.9.0",
    "mcp[cli]>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/your-username/gemini-media-mcp"
Documentation = "https://github.com/your-username/gemini-media-mcp#readme"
Repository = "https://github.com/your-username/gemini-media-mcp"
Issues = "https://github.com/your-username/gemini-image-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "paid: marks tests as requiring real API calls and money (deselect with '-m \"not paid\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[project.scripts]
gemini-image-mcp = "server:main"
install-gemini-mcp = "scripts.install_server:main"
